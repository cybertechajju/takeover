<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM_ACCESS // HELLO_WORLD</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #00FF41;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Scanline effect */
        body::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .terminal {
            border: 1px solid #00FF41;
            padding: 2.5rem;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.3), inset 0 0 20px rgba(0, 255, 65, 0.1);
            background: rgba(0, 15, 0, 0.9);
            max-width: 650px;
            width: 90%;
            position: relative;
            z-index: 3;
        }

        .header {
            font-size: 0.85rem;
            color: #008F11;
            margin-bottom: 1.5rem;
            border-bottom: 1px dashed #008F11;
            padding-bottom: 0.5rem;
        }

        h1 {
            font-size: 2.2rem;
            text-shadow: 0 0 8px #00FF41;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .cursor {
            display: inline-block;
            width: 12px;
            height: 24px;
            background-color: #00FF41;
            animation: blink 1s infinite;
            vertical-align: middle;
            margin-left: 5px;
        }

        .status {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #00FF41;
        }

        .subtext {
            color: #008F11;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="terminal">
        <div class="header">ROOT@MATRIX:~# ./init_sequence.sh</div>
        <h1 id="hacker-text">HELLO, WORLD_</h1>
        <div class="cursor"></div>
        <div class="status">[+] CONNECTION ESTABLISHED // ACCESS GRANTED</div>
        <div class="subtext">SECURITY PROTOCOL BYPASSED IN 0.004s</div>
    </div>

    <script>
        // Hacker text-scramble effect on load
        const textElement = document.getElementById('hacker-text');
        const targetText = "HELLO, HACKER_";
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*_";
        let iteration = 0;

        const interval = setInterval(() => {
            textElement.innerText = targetText
                .split("")
                .map((char, index) => {
                    if (index < iteration) {
                        return targetText[index];
                    }
                    return chars[Math.floor(Math.random() * chars.length)];
                })
                .join("");

            if (iteration >= targetText.length) {
                clearInterval(interval);
            }

            iteration += 1 / 2;
        }, 80);
    </script>

</body>
</html>
